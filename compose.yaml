# Minimal SleepLab compose file — no .env required.
# See compose.advanced.yaml for a fully documented example with all options.
name: sleeplab

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cpap
      POSTGRES_USER: cpap
      POSTGRES_PASSWORD: cpap
    volumes:
      - sleeplab_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpap -d cpap"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: joshuaaaronmyers/sleeplab:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://cpap:cpap@postgres:5432/cpap
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DISABLE_USER_REGISTRATION: ${DISABLE_USER_REGISTRATION:-false}
      # Recommended/default ResMed path. Set to "0" for the legacy/native fallback.
      SLEEPLAB_USE_CPAP_PARSER: ${SLEEPLAB_USE_CPAP_PARSER:-1}
    ports:
      # Web UI (nginx).
      - "8080:8080"
      # API (FastAPI). The browser calls the API directly at API_URL
      # (default http://127.0.0.1:8000); nginx does not proxy /api, so this port
      # must be published for the dashboard to load data. The default CORS allow
      # list already includes http://localhost:8080 and http://127.0.0.1:8080.
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  sleeplab_postgres_data:
