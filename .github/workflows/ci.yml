name: CI

on:
  pull_request:
    branches:
      - main
      - develop/2.0
  push:
    branches:
      - develop/2.0
    tags:
      - "v*"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin "${{ github.base_ref }}" --depth=1
          changed_files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"

          echo "$changed_files"

          backend=false
          frontend=false

          if echo "$changed_files" | grep -Eq '^(api/|importer/|tests/|migrations/|pyproject\.toml|uv\.lock|requirements\.txt|api/requirements\.txt|nx\.json|\.github/workflows/ci\.yml)'; then
            backend=true
          fi

          if echo "$changed_files" | grep -Eq '^(frontend/|package\.json|package-lock\.json|nx\.json|\.github/workflows/ci\.yml)'; then
            frontend=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check version alignment
        run: |
          # Normalize a PEP 440 pre-release (e.g. 2.0.0a24 / 2.0.0b1 / 2.0.0rc1)
          # to the semver form the npm packages, VERSION file, and git tags use
          # (e.g. 2.0.0-alpha.24). pyproject.toml legitimately stores the PEP 440
          # form, so a raw string compare can never match — normalize first.
          norm() {
            echo "$1" | sed -E 's/a([0-9]+)$/-alpha.\1/; s/b([0-9]+)$/-beta.\1/; s/rc([0-9]+)$/-rc.\1/'
          }

          TAG_VERSION=""
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          PYPROJECT_RAW=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          PYPROJECT_VERSION=$(norm "$PYPROJECT_RAW")
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          FRONTEND_VERSION=$(jq -r '.version' frontend/package.json)
          # VERSION is "<calver> [<semver>]"; the bracketed semver is the app version.
          VERSION_FILE_VERSION=$(sed -n 's/.*\[\(.*\)\].*/\1/p' VERSION | head -1)

          echo "pyproject.toml:        $PYPROJECT_RAW -> $PYPROJECT_VERSION"
          echo "package.json:          $PACKAGE_VERSION"
          echo "frontend/package.json: $FRONTEND_VERSION"
          echo "VERSION:               $VERSION_FILE_VERSION"
          if [[ -n "$TAG_VERSION" ]]; then
            echo "git tag:               v$TAG_VERSION"
          fi

          # NOTE: NOTICE.md carries its own independent third-party-notices
          # document version (managed by the update-notice workflow), not the app
          # version, so it is intentionally not compared here.

          ERRORS=0
          check_version() {
            if [[ "$2" != "$PYPROJECT_VERSION" ]]; then
              echo "::error::Version mismatch: $1 ($2) != pyproject.toml ($PYPROJECT_RAW -> $PYPROJECT_VERSION)"
              ERRORS=$((ERRORS+1))
            fi
          }
          check_version "package.json" "$PACKAGE_VERSION"
          check_version "frontend/package.json" "$FRONTEND_VERSION"
          check_version "VERSION" "$VERSION_FILE_VERSION"
          if [[ -n "$TAG_VERSION" ]]; then
            check_version "git tag" "$TAG_VERSION"
          fi

          if [[ $ERRORS -gt 0 ]]; then
            exit 1
          fi
          echo "All versions aligned!"

  backend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cpap
          POSTGRES_PASSWORD: cpap
          POSTGRES_DB: cpap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --extra parser --group dev

      - name: Verify parser runtime
        run: uv run python -c "import cpap_parser, cpap_py"

      - name: Lint with ruff
        run: uv run ruff check importer/ tests/ --output-format=github

      - name: Run backend tests
        run: uv run pytest -v --tb=short
        env:
          DATABASE_URL: postgresql+psycopg2://cpap:cpap@localhost:5432/cpap_test
          SECRET_KEY: test-secret-key-for-ci-1234567890abcdef
          OPENAI_API_KEY: ""

  frontend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Validate workspace lockfile
        run: npm run check:workspace-lockfile

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run frontend tests
        run: npm run test:frontend
