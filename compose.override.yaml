services:
  app:
    image: sleeplab-local-alpha
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_URL: http://localhost:8000
      CORS_ALLOWED_ORIGINS: "*"
      # Keep local builds explicit about using the recommended/default parser path.
      # Set to "0" to exercise the legacy/native fallback.
      SLEEPLAB_USE_CPAP_PARSER: "1"
    ports:
      - "8080:8080"
      - "8000:8000"
